    margin:0; font-size:3.6vh; font-weight:800; letter-spacing:0.01em;
    text-transform:uppercase;
  }
  .totalwrap{ display:flex; align-items:center; gap:2.2vh; }
  .ring{ position:relative; width:9vh; height:9vh; }
  .ring svg{ transform:rotate(-90deg); width:100%; height:100%; }
  .ring circle{ fill:none; stroke-width:8; }
  .ring .track{ stroke:rgba(255,255,255,0.08); }
  .ring .fill{ stroke:#96b498; stroke-linecap:round; transition:stroke-dashoffset 0.5s ease, stroke 0.5s ease; }
  .ring-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:2vh; font-weight:800;
  }
  .total-caption{ text-align:right; }
  .total-caption .num{ font-size:1.15vh; letter-spacing:0.24em; color:var(--text-dim); text-transform:uppercase; font-weight:600; }
  .total-caption .lbl{ font-size:1.6vh; color:var(--text); font-weight:600; margin-top:0.4vh; }

  /* grid */
  .grid{
    flex:1; display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(2,1fr);
    gap:1.8vh;
  }
  .card{
    position:relative; overflow:hidden;
    background:var(--card); border:1px solid var(--card-line); border-radius:1.4vh;
    padding:2vh 2vh 1.8vh; cursor:pointer; user-select:none;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .card:hover{ border-color:rgba(255,255,255,0.22); }
  .fillbar{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    opacity:0.28; transition:width 0.4s ease;
  }
  .card-top{ position:relative; display:flex; align-items:flex-start; justify-content:space-between; }
  .badge{
    width:3.6vh; height:3.6vh; border-radius:0.9vh; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:1.7vh; flex-shrink:0;
  }
  .pct{ font-size:1.9vh; font-weight:800; }
  .goal-text{
    position:relative; font-size:1.55vh; line-height:1.32; font-weight:600; margin-top:1.4vh;
  }
  .hint{
    position:relative; font-size:1.05vh; color:var(--text-dim); margin-top:1vh; letter-spacing:0.02em;
  }

  /* footer */
  .footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:2.4vh; padding-top:1.6vh; border-top:1px solid var(--card-line);
    font-size:1.25vh; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-dim); font-weight:600;
  }
  .footer .reset{ cursor:pointer; opacity:0.5; letter-spacing:0.1em; }
  .footer .reset:hover{ opacity:1; color:#96b498; }
</style>
</head>

    <div class="totalwrap">

          <circle class="fill" id="ringFill" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264"></circle>

</div>

<script>
const GOALS = [
  { n:1, text:"Utleie av lokalene etter Telway", color:"g1" },
  { n:2, text:"Leie ut u. etg TV3 (Ahlsell) og TV1 (Assemblin)", color:"g2" },
  { n:3, text:"Salg av tomter Minken", color:"g3" },
  { n:4, text:"Tilfredsstillende leie Globusgården for igangsetting av prosjekt", color:"g4" },
  { n:5, text:"Igangsatt regulering Sagvollskogen", color:"g5" },
  { n:6, text:"Inngå avtale om salg av Tordenskiodsgate 2 med BFK", color:"g1" },
  { n:7, text:"Salg av lagerseksjoner, samt tegne 2500 kvm kommersielt", color:"g2" },
  { n:8, text:"Fylle definerte ledige arealer", color:"g3" },
  { n:9, text:"Oppnå høyere leievekst enn KPI v/ reforhandling", color:"g4" },
  { n:10, text:"Selge eller løse Husebysletta 9 kommersielt (dvs tegning av leiekontrakter 2. etg)", color:"g5" },
];

const COLORS = {
  g1:"#a8e0c2", g2:"#74c39d", g3:"#45a67c", g4:"#2b7a58", g5:"#1a4a38"
};
const BADGE_TEXT = {
  g1:"#173328", g2:"#173328", g3:"#0e2118", g4:"#f5f8f6", g5:"#f5f8f6"
};
const PROGRESS_COLOR = "#96b498";

const STORAGE_KEY = "dpend-halvarlige-mal-2026";
let progress = {};
GOALS.forEach(g => progress[g.n] = 0);

const grid = document.getElementById("grid");
const cardEls = {};

function buildCards(){
  GOALS.forEach(g => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.borderColor = "rgba(255,255,255,0.08)";
    card.innerHTML = `
      <div class="fillbar" style="background:${PROGRESS_COLOR}"></div>
      <div class="card-top">
        <div class="badge" style="background:${COLORS.g5};color:${BADGE_TEXT.g5}">${String(g.n).padStart(2,'0')}</div>
        <div class="pct" style="color:${PROGRESS_COLOR}">0%</div>
      </div>
      <div>
        <div class="goal-text">${g.text}</div>
        <div class="hint">Klikk for å oppdatere fremgang</div>
      </div>
    `;
    card.addEventListener("click", (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      let pct = Math.round((x / rect.width) * 100 / 5) * 5;
      pct = Math.max(0, Math.min(100, pct));
      progress[g.n] = pct;
      render();
      save();
    });
    grid.appendChild(card);
    cardEls[g.n] = card;
  });
}

function render(){
  GOALS.forEach(g => {
    const card = cardEls[g.n];
    const pct = progress[g.n] || 0;
    card.querySelector(".fillbar").style.width = pct + "%";
    card.querySelector(".pct").textContent = pct + "%";
  });
  const values = Object.values(progress);
  const avg = Math.round(values.reduce((a,b)=>a+b,0) / values.length);
  const started = values.filter(v => v > 0).length;
  const done = values.filter(v => v >= 100).length;

  const circumference = 264;
  const offset = circumference - (circumference * avg / 100);
  document.getElementById("ringFill").style.strokeDashoffset = offset;
  document.getElementById("ringFill").style.stroke = PROGRESS_COLOR;
  document.getElementById("ringLabel").textContent = avg + "%";
  document.getElementById("totalLabel").textContent = done + " fullført · " + started + " av 10 i gang";
}

async function save(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(progress), true);
  }catch(err){ console.error("Kunne ikke lagre fremgang:", err); }
}

async function load(){
  try{
    const result = await window.storage.get(STORAGE_KEY, true);
    if(result && result.value){
      const saved = JSON.parse(result.value);
      GOALS.forEach(g => { if(saved[g.n] !== undefined) progress[g.n] = saved[g.n]; });
    }
  }catch(err){
    // ingen lagret data ennå
  }
  render();
}

document.getElementById("resetBtn").addEventListener("click", () => {
  GOALS.forEach(g => progress[g.n] = 0);
  render();
  save();
});

buildCards();
load();
</script>
